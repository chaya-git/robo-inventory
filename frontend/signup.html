<!doctype html>
<html>
  <head>
    <title>Signup - RoboManthan</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="loginBox">
      <h1>Create Account</h1>
      <input id="signupName" placeholder="Full Name" />
      <input id="signupEmail" placeholder="Email" />
      <input id="signupPassword" type="password" placeholder="Password" />
      <button onclick="submitSignup()">Sign Up</button>
      <p><a href="login.html">Back to Login</a></p>
    </div>
    <script src="config.js"></script>
    <script>
      async function submitSignup() {
        const name = document.getElementById('signupName').value.trim();
        const email = document.getElementById('signupEmail').value.trim();
        const password = document.getElementById('signupPassword').value;
        if (!name || !email || !password) return alert('Please fill all fields');
        const resp = await fetch(`${API_URL}/customerSignup`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });
        const result = await resp.json();
        if (result.success) {
          if (result.token) localStorage.setItem('token', result.token);
          localStorage.setItem('role', result.role || 'customer');
          localStorage.setItem('userEmail', email);
          window.location.href = 'index.html';
        } else {
          alert(result.message || 'Could not create account');
        }
      }
    </script>
  </body>
</html>
